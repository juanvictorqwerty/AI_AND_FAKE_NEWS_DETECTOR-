name: Sync FastAPI to Hugging Face Hub

on:
  push:
    branches: [main]
    # Only trigger this build if files inside the analysis folder change
    paths:
      - "analysis/**"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Ensures model weights inside analysis are downloaded

      - name: Push Analysis Sub-folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Initialize a temporary git repo inside the analysis folder
          cd analysis
          git init

          # 2. Configure a dummy git user for the commit context
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 3. Stage everything within the analysis directory
          git add .
          git commit -m "deploy: sync fastapi app to hugging face"

          # 4. Force push this localized directory directly to your Hugging Face space
          git remote add space https://juanvictorqwerty:$HF_TOKEN@huggingface.co/spaces/juanvictorqwerty/AI_Image
          git push --force space main:main
